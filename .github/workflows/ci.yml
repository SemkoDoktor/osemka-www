name: Sprawdzenie strony

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typy workera (formularze)
        run: npx tsc -p worker/tsconfig.json
      - name: Budowa strony
        run: npm run build
