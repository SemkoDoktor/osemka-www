# Konfiguracja Cloudflare Pages: strona statyczna (dist/) + funkcje formularzy (functions/).
# Pages pozwala podpiąć www.osemka.info samym wpisem CNAME, bez przenoszenia DNS.
name = "osemka-www"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[vars]
SITE_URL = "https://www.osemka.info"
OWNER_EMAIL = "kapitan@osemka.info"   # tu przychodzą zapytania ze strony
# Wysyłka maili przez Microsoft 365 (Graph API, aplikacja w Entra ID).
MAIL_FROM = "kapitan@osemka.info"     # skrzynka nadawcy; aplikacja ma dostęp tylko do niej
MS_TENANT_ID = "0e6415f1-ebec-4c5c-8512-9cb821a0eb6c"   # Entra ID: identyfikator dzierżawy
MS_CLIENT_ID = "f3883a42-4c86-45e6-b911-d4f34b2d026d"   # aplikacja osemka-www (obiekt SP 7d7f3eb3-1ec0-4dd4-a385-9cd59fb59625)

# Sekret ustawiany poza repozytorium (wkleja go właściciel w terminalu):
#   npx wrangler pages secret put MS_CLIENT_SECRET --project-name osemka-www

[[d1_databases]]
binding = "DB"
database_name = "osemka"
database_id = "66c66264-2041-4b8e-b3cb-1e3d33c370af"
migrations_dir = "migrations"
