# Konfiguracja Cloudflare Pages: strona statyczna (dist/) + funkcje formularzy (functions/).
# Pages pozwala podpiąć www.osemka.info samym wpisem CNAME, bez przenoszenia DNS.
name = "osemka-www"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"

[vars]
SITE_URL = "https://www.osemka.info"
OWNER_EMAIL = "kapitan@osemka.info"   # tu przychodzą zapytania ze strony
BREVO_LIST_ID = ""                    # uzupełnimy po założeniu konta Brevo
BREVO_DOI_TEMPLATE_ID = ""            # szablon maila potwierdzającego zapis

# Sekret ustawiany poza repozytorium:
#   npx wrangler pages secret put BREVO_API_KEY --project-name osemka-www

[[d1_databases]]
binding = "DB"
database_name = "osemka"
database_id = "66c66264-2041-4b8e-b3cb-1e3d33c370af"
migrations_dir = "migrations"
